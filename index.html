<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Key Chain</title>
<style>
:root {
  --canvas: #F2F2F7;
  --surface: #FFFFFF;
  --ink: #1D1D1F;
  --ink-2: #6E6E73;
  --ink-3: #AEAEB2;
  --hair: rgba(60, 60, 67, 0.16);
  --accent: #0071E3;
  --accent-ink: #FFFFFF;
  --accent-tint: rgba(0, 113, 227, 0.1);
  --good: #1E8E3E;
  --good-tint: rgba(52, 199, 89, 0.18);
  --warn: #C93400;
  --warn-tint: rgba(255, 159, 10, 0.2);
  --seg-bg: rgba(118, 118, 128, 0.12);
  --seg-thumb: #FFFFFF;
  --seg-shadow: 0 2px 6px rgba(0, 0, 0, 0.1), 0 0 0 0.5px rgba(0, 0, 0, 0.05);
  --switch-off: rgba(120, 120, 128, 0.16);
  --switch-on: #34C759;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #000000;
    --surface: #1C1C1E;
    --ink: #F5F5F7;
    --ink-2: #A1A1A6;
    --ink-3: #636366;
    --hair: rgba(84, 84, 88, 0.6);
    --accent: #0A84FF;
    --accent-tint: rgba(10, 132, 255, 0.2);
    --good: #30D158;
    --good-tint: rgba(48, 209, 88, 0.2);
    --warn: #FF9F0A;
    --warn-tint: rgba(255, 159, 10, 0.22);
    --seg-bg: rgba(118, 118, 128, 0.24);
    --seg-thumb: #636366;
    --seg-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    --switch-off: rgba(120, 120, 128, 0.32);
    --switch-on: #30D158;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font: 400 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }

.app {
  max-width: 520px;
  margin: 0 auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left));
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.022em; }
.mic {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--seg-bg);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}
.mic .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.mic.on { background: var(--good-tint); color: var(--good); }
.mic.on .dot { background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
.mic.err { background: var(--warn-tint); color: var(--warn); }
.mic.err .dot { background: var(--warn); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Tabs + segmented controls */
.seg { display: flex; background: var(--seg-bg); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { flex: 1; font-size: 13px; font-weight: 600; padding: 7px 6px; border-radius: 7px; white-space: nowrap; transition: background-color 0.15s; }
.seg button[aria-selected="true"] { background: var(--seg-thumb); box-shadow: var(--seg-shadow); }
.tabs { margin-bottom: 12px; }

.status { font-size: 13px; color: var(--ink-2); margin: -2px 2px 12px; }
.status.warn { color: var(--warn); }
.heard { font-style: italic; }

/* Cards */
.card { background: var(--surface); border-radius: 20px; padding: 16px; margin-bottom: 10px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.hear { font-size: 14px; font-weight: 600; color: var(--accent); }
.hear:disabled { opacity: 0.35; cursor: default; }
.key-name { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin-top: 2px; }
.via { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.via b { color: var(--accent); font-weight: 600; }

.prog { display: grid; gap: 6px; margin-top: 10px; }
.pchip {
  background: var(--canvas);
  border-radius: 12px;
  padding: 10px 2px 11px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
  transition: background-color 0.12s;
}
.pchip b { font-family: var(--font-round); font-size: 28px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
.pchip b sup { font-size: 12px; font-weight: 600; margin-left: 1px; color: var(--ink-2); }
.pchip small { font-size: 11px; font-weight: 600; color: var(--ink-2); }
.pchip i { font-style: normal; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; }
.pchip.var { box-shadow: inset 0 0 0 1.5px var(--accent); }
.pchip.now { background: var(--accent); color: var(--accent-ink); }
.pchip.now b sup, .pchip.now small, .pchip.now i { color: inherit; opacity: 0.85; }
.pchip .cn { font-family: var(--font-round); font-size: 17px; font-weight: 600; line-height: 1.2; white-space: normal; overflow-wrap: anywhere; padding: 0 4px; }
.prog-name { font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.prog-name b { color: var(--ink); font-weight: 600; }
.prog-name .vary { color: var(--accent); }

.actions { display: flex; gap: 8px; margin-top: 14px; }
.btn { height: 46px; border-radius: 12px; font-size: 16px; font-weight: 600; padding: 0 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
.btn.tint { background: var(--accent-tint); color: var(--accent); }
.btn:disabled { opacity: 0.35; cursor: default; }

/* Play along */
.play { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.play .btn { flex: 1; }
.tempo { display: flex; align-items: center; background: var(--seg-bg); border-radius: 12px; height: 46px; padding: 0 4px; flex: none; }
.tempo button { width: 36px; height: 38px; border-radius: 9px; font-size: 20px; font-weight: 500; }
.tempo button:active { background: var(--seg-thumb); }
.tempo span { min-width: 32px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.tempo small { font-size: 11px; color: var(--ink-2); margin-right: 2px; }
.beat { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 16px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--hair); }
.dots i.on { background: var(--accent); }
.beat-txt { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.beat-txt b { color: var(--accent); font-weight: 600; }

.br-title { font-size: 24px; font-weight: 700; letter-spacing: -0.015em; margin-top: 2px; }
.br-move { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.br-move b { color: var(--accent); font-weight: 600; }
.yours {
  margin-top: 12px;
  background: var(--accent-tint);
  color: var(--accent);
  border-radius: 14px;
  padding: 16px 14px;
  text-align: center;
}
.yours b { display: block; font-size: 20px; font-weight: 700; }
.yours span { font-size: 13px; }

/* Key map */
.kmap { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 12px; }
.kcell { background: var(--canvas); border-radius: 10px; padding: 6px 1px 7px; text-align: center; min-width: 0; }
.kcell b { display: block; font-family: var(--font-round); font-size: 15px; font-weight: 600; }
.kcell i { display: block; font-style: normal; font-size: 11px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.kcell.on { background: var(--accent); color: var(--accent-ink); }
.kcell.on i { color: inherit; }

/* Example chords */
.ex {
  font-family: var(--font-round);
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-tint);
  border-radius: 9px;
  padding: 5px 9px;
  margin-top: 7px;
  display: inline-block;
}
.ex .arr { color: var(--ink-3); font-weight: 500; margin: 0 2px; }
.ex-hear { margin-left: 8px; font-size: 13px; font-weight: 600; color: var(--accent); vertical-align: 1px; }
.ex-note { font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.4; }

/* Modulation options */
.group-head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 4px 7px; }
.group-title { font-size: 13px; color: var(--ink-2); }
.link { font-size: 14px; font-weight: 600; color: var(--accent); }
.list { background: var(--surface); border-radius: 16px; overflow: hidden; }
.list + .list { margin-top: 10px; }
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  min-height: 60px;
  position: relative;
  cursor: pointer;
}
.opt + .opt::before { content: ""; position: absolute; top: 0; left: 50px; right: 0; border-top: 0.5px solid var(--hair); }
.opt:active { background: var(--seg-bg); }
.opt.queued { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 16px; }
.num {
  flex: none;
  align-self: flex-start;
  margin-top: 2px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent-tint);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  display: grid;
  place-items: center;
}
.opt-main { flex: 1; min-width: 0; }
.opt-key { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.opt-move { font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.opt-move b { color: var(--ink); font-weight: 600; }
.chev { color: var(--ink-3); font-size: 20px; flex: none; }
.qtag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 3px; letter-spacing: 0; }

/* Settings rows */
.row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 48px; position: relative; cursor: pointer; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 0.5px solid var(--hair); }
.row.stack { flex-direction: column; align-items: stretch; gap: 8px; cursor: default; }
.row.off { opacity: 0.4; pointer-events: none; }
.row-main { flex: 1; min-width: 0; }
.row-label { font-size: 16px; }
.row-sub { font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.row-act { color: var(--accent); }
.row-act.danger { color: #FF3B30; }
.switch { flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--switch-off); position: relative; transition: background-color 0.2s; }
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16); transition: transform 0.2s;
}
.row[aria-checked="true"] .switch { background: var(--switch-on); }
.row[aria-checked="true"] .switch::after { transform: translateX(20px); }
.mini { flex: none; width: 42px; height: 26px; border-radius: 13px; background: var(--switch-off); position: relative; transition: background-color 0.2s; }
.mini::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16); transition: transform 0.2s;
}
.mini[aria-checked="true"], [aria-checked="true"] > .mini { background: var(--switch-on); }
.mini[aria-checked="true"]::after, [aria-checked="true"] > .mini::after { transform: translateX(16px); }
.stepper { display: inline-flex; align-items: center; background: var(--seg-bg); border-radius: 9px; padding: 2px; flex: none; }
.stepper button { width: 40px; height: 32px; border-radius: 7px; font-size: 20px; font-weight: 500; }
.stepper button:active { background: var(--seg-thumb); }
.stepper span { min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 999px; background: var(--seg-bg); color: var(--ink-2); font-size: 14px; font-weight: 500; padding: 7px 13px; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.note { font-size: 13px; color: var(--ink-2); padding: 7px 4px 0; }

.cmds { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 14px; font-size: 14px; margin: 0; }
.cmds dt { font-weight: 600; white-space: nowrap; }
.cmds dd { margin: 0; color: var(--ink-2); }

/* Progress */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.stat-row div + div { border-left: 0.5px solid var(--hair); }
.stat-row b { display: block; font-family: var(--font-round); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-row span { font-size: 12px; color: var(--ink-2); }
.kgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; margin-top: 14px; }
.kg { font-size: 10px; font-weight: 600; text-align: center; padding: 5px 0; border-radius: 6px; background: var(--canvas); color: var(--ink-3); white-space: nowrap; overflow: hidden; letter-spacing: -0.02em; }
.kg.on { background: var(--accent-tint); color: var(--accent); }
.kg.here { background: var(--accent); color: var(--accent-ink); }

/* Library */
.lib-note { font-size: 13px; color: var(--ink-2); padding: 10px 4px 10px; }
details.cat { background: var(--surface); border-radius: 16px; margin-bottom: 8px; overflow: hidden; }
details.cat > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
details.cat > summary::-webkit-details-marker { display: none; }
.cat-main { flex: 1; min-width: 0; }
.cat-name { font-size: 16px; font-weight: 600; }
.cat-sub { font-size: 13px; color: var(--ink-2); }
.chev2 { color: var(--ink-3); font-size: 18px; transition: transform 0.2s; flex: none; }
details[open] .chev2 { transform: rotate(90deg); }
.subhead { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 8px 14px 4px; border-top: 0.5px solid var(--hair); }
.prow { display: flex; align-items: center; gap: 12px; padding: 9px 14px; position: relative; cursor: pointer; }
.prow + .prow::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 0.5px solid var(--hair); }
.prow-main { flex: 1; min-width: 0; }
.prow-deg { font-family: var(--font-round); font-size: 16px; font-weight: 600; word-spacing: 3px; }
.prow-deg sup { font-size: 10px; color: var(--ink-2); }
.prow-deg small { font-size: 10px; color: var(--ink-2); }
.prow-sub { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.prow[aria-checked="false"] .prow-main { opacity: 0.45; }
.prow.na .prow-main { opacity: 0.35; }
.cat-actions { display: flex; gap: 16px; padding: 8px 14px 12px; border-top: 0.5px solid var(--hair); }
.mv-card { background: var(--surface); border-radius: 16px; padding: 12px 14px 14px; margin-bottom: 8px; }
.mv-head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.mv-name { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.mv-hint { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.mv-card.na { opacity: 0.45; }

.flash { animation: flash 0.6s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: inset 0 0 0 2px transparent; } }

@media (max-width: 360px) {
  .pchip b { font-size: 24px; }
  .key-name { font-size: 30px; }
  .seg button { font-size: 12px; padding: 7px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="title">Key Chain</h1>
    <button class="mic" id="mic" aria-pressed="false"><span class="dot"></span><span id="mic-txt">Voice off</span></button>
  </header>
  <div class="seg tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="drill" aria-selected="true">Drill</button>
    <button role="tab" data-tab="lib" aria-selected="false">Library</button>
    <button role="tab" data-tab="set" aria-selected="false">Settings</button>
  </div>
  <p class="status" id="status" hidden></p>

  <section id="v-drill">
    <section class="card" id="c-key">
      <div class="label">Key</div>
      <div class="key-name" id="key-name"></div>
      <div class="via" id="via"></div>
      <div id="via-ex"></div>
      <div class="kmap" id="kmap" hidden></div>
    </section>

    <section class="card" id="c-prog">
      <div id="prog-wrap">
        <div class="card-head"><span class="label">Progression</span><button class="hear" id="hear-prog">▶︎ Hear</button></div>
        <div class="prog" id="prog"></div>
        <div class="prog-name" id="prog-name"></div>
      </div>
      <div id="bridge" hidden>
        <div class="label">Bridge</div>
        <div class="br-title" id="br-title"></div>
        <div class="br-move" id="br-move"></div>
        <div id="br-body"></div>
      </div>
      <div class="beat" id="beat" hidden><span class="dots" id="dots"></span><span class="beat-txt" id="beat-txt"></span></div>
      <div class="play">
        <button class="btn tint" id="play">▶︎ Play along</button>
        <div class="tempo"><button data-bpm="-4" aria-label="Slower">−</button><span id="bpm"></span><small>bpm</small><button data-bpm="4" aria-label="Faster">+</button></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="next">Next progression</button>
        <button class="btn tint" id="back" disabled>Back</button>
      </div>
    </section>

    <div class="group-head"><span class="group-title">Modulate to</span><button class="link" id="shuffle">Shuffle</button></div>
    <div class="list" id="opts"></div>
    <div class="list" id="ex-toggle"></div>

    <div class="group-head"><span class="group-title">Progress</span><button class="link" id="stats-reset">Reset</button></div>
    <section class="card" id="stats"></section>
  </section>

  <section id="v-lib" hidden></section>
  <section id="v-set" hidden></section>
</div>

<script>
/*ENGINE-START*/
/* ---------- spelling + keys ---------- */
const LET = ['C','D','E','F','G','A','B'];
const NAT = [0,2,4,5,7,9,11];
const MAJ = [0,2,4,5,7,9,11];
const SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const mod = (n, m = 12) => ((n % m) + m) % m;
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function spell(l, pc) {
  l = mod(l, 7); pc = mod(pc);
  const d = mod(pc - NAT[l] + 6) - 6, L = LET[l];
  if (Math.abs(d) >= 2 || (d === 1 && (L === 'E' || L === 'B')) || (d === -1 && (L === 'F' || L === 'C'))) return (d < 0 ? FLAT : SHARP)[pc];
  return L + (d === 1 ? '♯' : d === -1 ? '♭' : '');
}
const MAJ_TONIC = [0,1,1,2,2,3,3,4,5,5,6,6];
const MIN_TONIC = [0,0,1,2,2,3,3,4,4,5,6,6];
function key(pc, mode) {
  pc = mod(pc);
  const l = (mode === 'maj' ? MAJ_TONIC : MIN_TONIC)[pc];
  const root = spell(l, pc);
  return { pc, l, mode, id: pc + mode, root, name: root + (mode === 'maj' ? ' major' : ' minor') };
}
const ALL_KEYS = [];
for (let i = 0; i < 12; i++) { ALL_KEYS.push(key(i, 'maj')); ALL_KEYS.push(key(i, 'min')); }
const both = pc => [key(pc, 'maj'), key(pc, 'min')];
const ks = K => K.root + (K.mode === 'min' ? 'm' : '');
// Guitar-friendly pool: C G D A E F B♭ and their relative minors.
const FRIENDLY = { maj: [0, 7, 2, 9, 4, 5, 10], min: [9, 4, 11, 6, 1, 2, 7] };

/* ---------- chord codes ----------
   "6"      degree, quality from the key
   "b7"     flat degree, "#4" sharp degree
   "4.m"    quality override: m M dim dim7 aug sus sus2 7 7sus m7 maj7 6 m6 add9 mM7
   "5/6"    secondary dominant (5 of 6)
   "1_3"    bass note: 1 chord over the 3
*/
const QMAJ = { '1':'M','2':'m','3':'m','4':'M','5':'M','6':'m','7':'dim','b2':'M','b3':'M','b6':'M','b7':'M' };
const QMIN = { '1':'m','2':'dim','b3':'M','4':'m','5':'M','b6':'M','b7':'M','b2':'M' };
const TRIAD_OV = { m: 'm', M: 'M', dim: 'dim' };
const EXT_Q = { dim7: 'dim', aug: 'aug', sus: 'M', sus2: 'M', '7': 'M', '7sus': 'M', m7: 'm', maj7: 'M', '6': 'M', m6: 'm', add9: 'M', mM7: 'm' };
const NAME_SUF = { dim7: 'dim7', aug: '+', sus: 'sus4', sus2: 'sus2', '7': '7', '7sus': '7sus4', m7: 'm7', maj7: 'maj7', '6': '6', m6: 'm6', add9: 'add9', mM7: 'm(maj7)' };
const SUP = { m: 'm', M: 'maj', dim: '°', dim7: '°7', aug: '+', sus: 'sus4', sus2: 'sus2', '7': '7', '7sus': '7sus4', m7: 'm7', maj7: 'maj7', '6': '6', m6: 'm6', add9: 'add9', mM7: 'm(maj7)' };
const TRI_SUF = { M: '', m: 'm', dim: 'dim', aug: '+' };

function cc(code, K) {
  const [main, bassC] = code.split('_');
  const [deg, qual] = main.split('.');
  let ch;
  const sm = deg.match(/^5\/(.+)$/);
  if (sm) {
    const t = cc(sm[1], K);
    ch = { l: mod(t.l + 4, 7), pc: mod(t.pc + 7), q: 'M', sec: true, base: deg };
  } else {
    const m = deg.match(/^([b#]?)([1-7])$/);
    if (!m) throw new Error('bad code ' + code);
    const acc = m[1] === 'b' ? -1 : m[1] === '#' ? 1 : 0, n = +m[2];
    const def = acc === 1 ? 'dim' : ((K.mode === 'maj' ? QMAJ : QMIN)[deg] || 'M');
    ch = { l: mod(K.l + n - 1, 7), pc: mod(K.pc + MAJ[n - 1] + acc), q: def, sec: false, base: deg };
  }
  if (qual) {
    if (TRIAD_OV[qual]) ch.q = TRIAD_OV[qual];
    else { ch.qx = qual; ch.q = EXT_Q[qual]; }
    ch.ov = qual;
  }
  if (bassC) { const b = cc(bassC, K); ch.bass = { l: b.l, pc: b.pc }; ch.bassCode = bassC; }
  return ch;
}

/* Chord colour: S.colour is 'written' (as the progression is written),
   '7' (7th chords throughout) or 'ext' (9ths, 11ths, 13ths, 6/9 where they fit the key). */
function sev(ch, s7, K) {
  if (ch.q === 'dim') return 'm7♭5';
  if (ch.q === 'aug') return '+';
  if (ch.q === 'm') return 'm7';
  if (s7 === 'dom') return '7';
  if (ch.base === '5' || ch.base === 'b7') return '7';
  if (K) {
    const def = (K.mode === 'maj' ? QMAJ : QMIN)[ch.base];
    if (K.mode === 'min' && ch.base === '4') return '7';
    if (ch.ov === 'M' && def && def !== 'M' && ch.base !== '1') return '7';
  }
  return 'maj7';
}
// The scale a chord lives in, for picking tensions that fit.
function scaleOf(ch, K) {
  const b = ch.base;
  let sc;
  if (K.mode === 'maj') {
    const borrowed = /^b/.test(b) || (ch.ov === 'm' && (b === '1' || b === '4' || b === '5')) || (ch.ov === 'dim' && b === '2');
    sc = borrowed ? [0,2,3,5,7,8,10] : MAJ;
  } else if (b === '5' && ch.q === 'M') sc = [0,2,3,5,7,8,11];
  else if (b === '4' && ch.q === 'M') sc = [0,2,3,5,7,9,10];
  else if (b === '1' && ch.q === 'M') sc = MAJ;
  else sc = [0,2,3,5,7,8,10];
  return new Set(sc.map(x => mod(K.pc + x)));
}
function domT(r, sc) {
  if (sc.has(mod(r + 2))) return sc.has(mod(r + 9)) ? '13' : '9';
  if (sc.has(mod(r + 1))) return '7♭9';
  return '7';
}
function extSuf(ch, s7, K) {
  const sc = scaleOf(ch, K), r = ch.pc, n9 = sc.has(mod(r + 2)), q = ch.qx;
  if (q) {
    if (q === '7') return domT(r, sc);
    if (q === 'maj7') return n9 ? 'maj9' : 'maj7';
    if (q === 'm7') return n9 ? 'm9' : 'm7';
    if (q === '6') return n9 ? '6/9' : '6';
    if (q === 'sus' && ch.base === '5') return '7sus4';
    return NAME_SUF[q];
  }
  if (ch.sec) return domT(r, sc);
  if (ch.q === 'dim') return 'm7♭5';
  if (ch.q === 'aug') return '+';
  if (ch.q === 'm') {
    if (ch.base === '1' && n9 && sc.has(mod(r + 5))) return 'm11';
    return n9 ? 'm9' : 'm7';
  }
  const def = (K.mode === 'maj' ? QMAJ : QMIN)[ch.base];
  if (s7 === 'dom' || ch.base === '5' || ch.base === 'b7' || (K.mode === 'min' && ch.base === '4') ||
      (ch.ov === 'M' && def && def !== 'M' && ch.base !== '1')) return domT(r, sc);
  if (ch.base === '1') return n9 && sc.has(mod(r + 9)) ? '6/9' : 'maj7';
  return n9 ? 'maj9' : 'maj7';
}
function chordName(ch, s7, K) {
  const lvl = (typeof S !== 'undefined' && S.colour) || 'written';
  let suf;
  if (lvl === 'ext' && K && !ch.bass) suf = extSuf(ch, s7, K);
  else if (lvl === 'ext' && K) suf = ch.qx ? NAME_SUF[ch.qx] : ch.sec ? '7' : sev(ch, s7, K);
  else {
    const s = lvl === '7' && !s7 ? 'dia' : s7;
    if (ch.qx) suf = NAME_SUF[ch.qx];
    else if (ch.sec) suf = '7';
    else if (s) suf = sev(ch, s, K);
    else suf = TRI_SUF[ch.q];
  }
  return spell(ch.l, ch.pc) + suf + (ch.bass ? '/' + spell(ch.bass.l, ch.bass.pc) : '');
}
const sym = s => s.replace(/b/g, '♭').replace(/#/g, '♯');
function degHTML(code) {
  const [main, bassC] = code.split('_');
  const [deg, qual] = main.split('.');
  return `<b>${sym(deg)}${qual ? `<sup>${SUP[qual]}</sup>` : ''}</b>${bassC ? `<small>over ${sym(bassC)}</small>` : ''}`;
}
function degInline(code) {
  const [main, bassC] = code.split('_');
  const [deg, qual] = main.split('.');
  return `${sym(deg)}${qual ? `<sup>${SUP[qual]}</sup>` : ''}${bassC ? `<small> over ${sym(bassC)}</small>` : ''}`;
}
function lbl(code) {
  const [deg, qual] = code.split('.');
  const pre = qual === 'm' ? 'minor ' : qual === 'M' ? 'major ' : '';
  return pre + sym(deg);
}
function diatonic(K) {
  return (K.mode === 'maj' ? ['1','2','3','4','5','6','7'] : ['1','2','b3','4','5.m','b6','b7']).map(c => ({ code: c, ch: cc(c, K) }));
}
const same = (a, b) => a.pc === b.pc && a.q === b.q;
const relMaj = K => K.mode === 'maj' ? K.pc : mod(K.pc + 3);
function fifthsDist(A, B) { const a = mod(relMaj(A) * 7), b = mod(relMaj(B) * 7), d = Math.abs(a - b); return Math.min(d, 12 - d); }
const close = (A, B) => fifthsDist(A, B) <= 1;
const relative = X => X.mode === 'maj' ? key(X.pc - 3, 'min') : key(X.pc + 3, 'maj');

/* ---------- chord-name helpers for examples ---------- */
const tri = (l, pc, q) => spell(l, pc) + TRI_SUF[q];
const I = Y => tri(Y.l, Y.pc, Y.mode === 'maj' ? 'M' : 'm');
const V = Y => spell(Y.l + 4, Y.pc + 7);
const V7 = Y => V(Y) + '7';
const IV = Y => tri(Y.l + 3, Y.pc + 5, Y.mode === 'maj' ? 'M' : 'm');
const two = Y => spell(Y.l + 1, Y.pc + 2) + (Y.mode === 'maj' ? 'm7' : 'm7♭5');
function triNotes(K) {
  const t3 = K.mode === 'maj' ? 4 : 3;
  return [[K.l, K.pc], [K.l + 2, K.pc + t3], [K.l + 4, K.pc + 7]].map(([l, p]) => ({ pc: mod(p), name: spell(l, p) }));
}

// A chord from `from` that is a good set-up chord in Y, spelled the way Y spells it.
const SC = { maj: { '2': 3, '4': 3, '6': 2, '1': 1, '3': 1 }, min: { '4': 3, 'b6': 3, '2': 2, 'b3': 1, 'b7': 1, '1': 0.5 } };
function choosePivot(from, Y, minScore) {
  const S2 = SC[Y.mode], yd = diatonic(Y), c = [];
  for (const f of from) for (const y of yd) {
    const s = S2[y.code];
    if (s && s >= (minScore || 0) && same(f.ch, y.ch)) c.push({ f, y, s });
  }
  if (!c.length) return null;
  const good = c.filter(x => x.s >= 2);
  const p = pick(good.length ? good : c);
  return { name: tri(p.y.ch.l, p.f.ch.pc, p.f.ch.q), old: p.f.code, neu: p.y.code };
}
const borrowedFrom = X => (X.mode === 'maj' ? ['b3', '4.m', 'b6', 'b7', '5.m'] : ['4.M', 'b2', '1.M']).map(c => ({ code: c, ch: cc(c, X) }));
const anyKey = X => ALL_KEYS.filter(Y => Y.id !== X.id);
const updown = (X, Y) => mod(Y.pc - X.pc) <= 6 ? 'up' : 'down';

/* ---------- modulation moves ----------
   tier: core (always), color (needs Chromatic chords on), adv (needs Advanced moves on)
   ex(X, Y) gives the worked example: chords + one-line note. */
const TECH = {
  pivot: {
    name: 'Pivot chord', tier: 'core',
    hint: () => 'Shared chord, then 5 → 1',
    dests: X => X.mode === 'maj'
      ? [key(X.pc + 7, 'maj'), key(X.pc + 5, 'maj'), key(X.pc + 2, 'min'), key(X.pc + 4, 'min'), key(X.pc + 9, 'min')]
      : [key(X.pc + 5, 'min'), key(X.pc + 7, 'min'), key(X.pc + 8, 'maj'), key(X.pc + 10, 'maj'), key(X.pc + 3, 'maj')],
    ok: (X, Y) => !!choosePivot(diatonic(X), Y),
    ex(X, Y) {
      const p = choosePivot(diatonic(X), Y);
      return { chords: [p.name, V7(Y), I(Y)], note: `${p.name} is the ${lbl(p.old)} in ${ks(X)} and the ${lbl(p.neu)} in ${ks(Y)}.` };
    }

    ex: (X, Y) => ({ chords: [V7(Y), I(Y)], note: `${V7(Y)} is an optional run-up. Then play the same loop from ${I(Y)}.` })

    hint: () => 'New 4 over its 5 in the bass → 1',

    ex(X, Y) {
      const c = `${IV(Y)}/${V(Y)}`;
      return { chords: [c, I(Y)], note: `${c} is a soft 5 (a 9sus4 sound). It lands on ${I(Y)} without a leading tone.` };
    }
  },
  sequence: {
    name: 'Sequence', tier: 'core',
    hint: (X, Y) => `Repeat a 2–5 a whole step ${updown(X, Y)}`,
    dests: X => [...both(X.pc + 2), ...both(X.pc - 2)],
    ex: (X, Y) => ({ chords: [two(X), V7(X), two(Y), V7(Y), I(Y)], note: `2–5 in ${ks(X)}, then the same shape a whole step ${updown(X, Y)}, landing in ${ks(Y)}.` })
  },
  pedal: {
    name: 'Pedal point', tier: 'core',
    hint: () => 'Hold a shared bass note',
    dests: X => triNotes(X).flatMap(t => both(t.pc - 7)).filter(Y => Y.id !== X.id),
    ex(X, Y) {
      const p = V(Y);
      return { chords: [I(X), `${IV(Y)}/${p}`, V7(Y), I(Y)], note: `Hold ${p} in the bass. It's in ${I(X)} and it's the 5 of ${ks(Y)}.` };
    }
  },
  common: {
    name: 'Common tone', tier: 'core',
    hint: () => 'Hold the note both 1 chords share',
    dests: X => ALL_KEYS.filter(Y => [3, 4, 8, 9].includes(mod(Y.pc - X.pc)) && !close(X, Y)),
    ok: (X, Y) => { const b = triNotes(Y).map(t => t.pc); return triNotes(X).some(t => b.includes(t.pc)); },

    }

  tritone: {
    name: 'Tritone sub', tier: 'color',

  gospel: {

    name: 'Diminished pivot', tier: 'adv',

  let guard = 0;
  while (playing && nextT < AC.currentTime + 0.15 && guard++ < 8) step();
}
function beats(t, n, b, forceClick) {
  for (let k = 0; k < n; k++) {
    if (S.click || forceClick) click(t + k * b, k === 0);
    const kk = k;
    at(t + k * b, () => dotsUI(kk, n));
  }
}
function step() {
  const t = nextT, b = 60 / S.bpm;
  if (P.phase === 'count') {
    for (let k = 0; k < 4; k++) { click(t + k * b, k === 0); const kk = k; at(t + k * b, () => { dotsUI(kk, 4); beatTxt(`Count-in · <b>${4 - kk}</b>`); }); }
    nextT = t + 4 * b;
    P.phase = 'loop';
    return;
  }
  if (P.phase === 'bridge') {
    const B = P.bridge;
    if (B.chords && B.k < B.chords.length) {
      const k = B.k, dur = S.beats * b;
      sound(B.chords[k], t, dur);
      beats(t, S.beats, b);
      at(t, () => { ui.bk = k; renderBridge(); beatTxt(`Bridge · chord <b>${k + 1}</b> of ${B.chords.length}`); });
      B.k++;
      nextT = t + dur;
      return;
    }
    if (!B.chords && B.k < B.bars) {
      const k = B.k;
      beats(t, 4, b, true);
      at(t, () => { ui.bk = k; renderBridge(); beatTxt(`Your bridge · bar <b>${k + 1}</b> of ${B.bars}`); });
      B.k++;
      nextT = t + 4 * b;
      return;
    }
    const ns = B.ns;
    plan = ns;
    P.phase = 'loop'; P.idx = 0; P.loop = 0; P.progN = 0; P.bridge = null;
    queued.opt = null; queued.auto = false; queued.prog = false;
    at(t, () => { ui.bridge = null; ui.bk = -1; arrive(ns, true); });
  }
  if (P.idx >= plan.codes.length) {
    P.idx = 0;
    P.loop++;
    if (queued.opt != null && plan.opts[queued.opt]) { beginBridge(queued.opt, t); step(); return; }
    if (queued.prog || P.loop >= S.loops) {
      if (!queued.prog) P.progN++;
      queued.prog = false;
      newProgPlan(t);
    }
  }
  if (P.idx === 0) maybeAutoQueue(t);
  const st = plan, i = P.idx, dur = S.beats * b;
  sound(chordName(cc(st.codes[i], st.key), st.prog.s7, st.key), t, dur);
  beats(t, S.beats, b);
  const lp = P.loop;
  at(t, () => chordUI(st, i, lp));
  P.idx++;
  nextT = t + dur;
}
function maybeAutoQueue(t) {
  if (!S.auto || queued.opt != null || queued.prog) return;
  if (P.loop === S.loops - 1 && P.progN >= S.perKey - 1 && plan.opts.length) {
    queued.opt = Math.floor(Math.random() * plan.opts.length);
    queued.auto = true;
    at(t, renderOpts);
  }
}
function beginBridge(i, t) {
  const o = plan.opts[i], ns = makeNext(plan, i);
  const info = { o, chords: S.examples ? o.ex.chords.slice() : null, bars: S.bridgeBars };
  P.phase = 'bridge';
  P.bridge = Object.assign({ ns, k: 0 }, info);
  at(t, () => {
    ui.bridge = info; ui.bk = -1; ui.now = -1;
    document.querySelectorAll('#kmap .kcell').forEach(el => el.classList.remove('on'));
    renderProg(); renderOpts();
  });
}
function newProgPlan(t) {
  const ns = Object.assign({}, plan, progState(plan.key, pickProg(plan.key, plan.prog)));
  plan = ns;
  P.loop = 0;
  P.idx = 0;
  at(t, () => { ST.progs++; saveST(); commit(ns, ['c-prog'], true); });
}
function chordUI(st, i, lp) {
  if (!playing) return;
  ui.now = i;
  document.querySelectorAll('#prog .pchip').forEach((el, k) => el.classList.toggle('now', k === i));
  const loops = S.auto || S.loops > 1 ? ` of ${S.loops}` : '';
  const nextTxt = queued.opt != null && cur.opts[queued.opt] ? ` · next: <b>${cur.opts[queued.opt].to.name}</b>` : queued.prog ? ' · <b>new progression next</b>' : '';
  beatTxt(`Loop <b>${lp + 1}</b>${loops}${nextTxt}`);
  if (S.kmap) {
    const pc = cc(st.codes[i], st.key).pc;
    document.querySelectorAll('#kmap .kcell').forEach(el => el.classList.toggle('on', +el.dataset.pc === pc));
  }
}
function dotsUI(k, n) {
  const d = $('dots');
  if (d.children.length !== n) d.innerHTML = '<i></i>'.repeat(n);
  [...d.children].forEach((el, j) => el.classList.toggle('on', j <= k));

let libTab = 'progs';

function exampleNames(p) {

function libMoveExample(t) {
  const T = TECH[t], X = key(0, 'maj');
  const ds = T.dests(X).filter(Y => Y.id !== X.id && (!T.ok || T.ok(X, Y)));
  const pref = [7, 5, 2, 3, 9, 8, 4, 10, 1, 11, 6].flatMap(pc => [pc + 'maj', mod(pc) + 'min']);
  const Y = pref.map(id => ds.find(K => K.id === id)).find(Boolean) || ds[0];
  return Y ? { Y, ex: T.ex(X, Y), hint: T.hint(X, Y) } : null;
}

});
$('via-ex').addEventListener('click', e => { if (e.target.closest('[data-hear-via]') && cur.via) preview(cur.via.ex.chords); });
$('ex-toggle').addEventListener('click', e => { if (e.target.closest('[data-sw]')) toggleExamples(); });
$('stats-reset').addEventListener('click', () => { ST = { keys: [cur.key.id], moves: {}, mods: 0, progs: 0 }; saveST(); renderStats(); });

function afterSettingChange(k) {
  saveS();
  if (k === 'names' || k === 'kmap' || k === 'colour') { render(); return; }
  if (!keyOK(cur.key)) { restart(); return; }
  if (k === 'vary' && !playing) cur = Object.assign({}, cur, progState(cur.key, cur.prog));
  if (['minor', 'color', 'adv', 'pool', 'nOpts', 'offT'].includes(k)) {
    let next = Object.assign({}, cur, { opts: genOptions(cur.key, cur.prev) });
    if (k === 'color' && !S.color && (cur.prog.x || cur.varied.length)) next = Object.assign(next, progState(cur.key, pickProg(cur.key, null)));
    cur = next;
    if (playing) { plan = cur; queued.opt = null; }
  }
  if (['off', 'offP'].includes(k) && !progOn(cur.prog) && !playing) {
    cur = Object.assign({}, cur, progState(cur.key, pickProg(cur.key, cur.prog)));
  }
  render();
}
$('v-set').addEventListener('click', e => {
  const t = e.target.closest('[data-preset],[data-sw],[data-var],[data-seg],[data-step],[data-act]');
  if (!t) return;
  if (t.dataset.preset) {
    const p = PRESETS[t.dataset.preset];
    for (const f of ['minor', 'color', 'adv', 'colour', 'vary', 'nOpts']) S[f] = p[f];
    if (p.everything) { S.off = []; S.offP = []; S.offT = []; Object.keys(S.vars).forEach(k => { S.vars[k] = true; }); }
    renderSettings();
    afterSettingChange('color');
    if (!keyOK(cur.key)) restart();
    return;
  }
  if (t.dataset.sw) {
    const k = t.dataset.sw;
    if (k === 'examples') { toggleExamples(); return; }
    S[k] = !S[k];
    renderSettings();
    afterSettingChange(k);
    return;
  }
  if (t.dataset.var) { S.vars[t.dataset.var] = !S.vars[t.dataset.var]; saveS(); renderSettings(); return; }
  if (t.dataset.seg) {
    const k = t.dataset.seg, v = t.dataset.val;
    S[k] = typeof DEF[k] === 'number' ? +v : v;
    renderSettings();
    afterSettingChange(k);
    return;
  }
  if (t.dataset.step) {
    const k = t.dataset.step, d = +t.dataset.d;
    if (k === 'bpm') { setBpm(S.bpm + d * 4); return; }
    if (k === 'nOpts') { S.nOpts = Math.min(6, Math.max(2, S.nOpts + d)); renderSettings(); afterSettingChange('nOpts'); }
    return;
  }
  if (t.dataset.act === 'restart') { restart(); showTab('drill'); return; }
  if (t.dataset.act === 'reset') {
    S = JSON.parse(JSON.stringify(DEF));
    saveS();
    renderSettings();
    restart();
  }
});
$('v-lib').addEventListener('click', e => {
  const tab = e.target.closest('[data-lib]');
  if (tab) { libTab = tab.dataset.lib; renderLibrary(); return; }
  const catSw = e.target.closest('[data-cat]');
  if (catSw) {
    e.preventDefault();
    const c = catSw.dataset.cat;
    S.off = S.off.includes(c) ? S.off.filter(x => x !== c) : S.off.concat(c);
    renderLibrary();
    afterSettingChange('off');
    return;
  }
  const all = e.target.closest('[data-catall]');
  if (all) {
    const c = all.dataset.catall, ids = ALL_PROGS.filter(p => p.cat === c).map(p => p.id);
    if (all.dataset.v === '1') { S.offP = S.offP.filter(id => !ids.includes(id)); S.off = S.off.filter(x => x !== c); }
    else S.offP = S.offP.filter(id => !ids.includes(id)).concat(ids);
    renderLibrary();
    afterSettingChange('offP');
    return;
  }
  const pr = e.target.closest('[data-prog]');
  if (pr) {
    const id = pr.dataset.prog, p = ALL_PROGS.find(x => x.id === id);
    if (S.off.includes(p.cat)) { S.off = S.off.filter(x => x !== p.cat); S.offP = S.offP.concat(ALL_PROGS.filter(x => x.cat === p.cat && x.id !== id).map(x => x.id)).filter(x => x !== id); }
    else S.offP = S.offP.includes(id) ? S.offP.filter(x => x !== id) : S.offP.concat(id);
    renderLibrary();
    afterSettingChange('offP');
    return;
  }
  const mv = e.target.closest('[data-tech]');
  if (mv) {
    const t = mv.dataset.tech;
    S.offT = S.offT.includes(t) ? S.offT.filter(x => x !== t) : S.offT.concat(t);
    renderLibrary();
    afterSettingChange('offT');
  }
});
$('v-lib').addEventListener('toggle', e => {
  const d = e.target.closest && e.target.closest('details[data-catd]');
  if (!d) return;
  if (d.open) openCats.add(d.dataset.catd); else openCats.delete(d.dataset.catd);
}, true);

function showTab(t) {
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', String(x.dataset.tab === t)));
  $('v-drill').hidden = t !== 'drill';
  $('v-lib').hidden = t !== 'lib';
  $('v-set').hidden = t !== 'set';
  if (t === 'lib') renderLibrary();
  if (t === 'set') renderSettings();
  window.scrollTo(0, 0);
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (e.target.matches && e.target.matches('[role="switch"], [role="button"]') && (k === ' ' || k === 'Enter')) {
    e.preventDefault();
    e.target.click();
    return;
  }
  if ($('v-drill').hidden) return;
  let done = true;
  if (k === ' ' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === 'n' || k === 'N') nextProg();
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace' || k === 'b' || k === 'B') back();
  else if (/^[1-6]$/.test(k)) takeOption(+k - 1);
  else if (k === 'k' || k === 'K') randomKey();
  else if (k === 's' || k === 'S') reshuffle();
  else if (k === 'e' || k === 'E') toggleExamples();
  else if (k === 'p' || k === 'P') { if (playing) stopPlay(); else startPlay(); }
  else if (k === '+' || k === '=') setBpm(S.bpm + 4);
  else if (k === '-' || k === '_') setBpm(S.bpm - 4);
  else done = false;
  if (done) e.preventDefault();
});

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
let rec = null, listening = false, sess = 0, fired = {}, wake = null, heardTimer = null;

const NUMS = { one: 0, won: 0, '1': 0, two: 1, to: 1, too: 1, '2': 1, three: 2, tree: 2, free: 2, '3': 2, four: 3, for: 3, '4': 3, five: 4, '5': 4, six: 5, sicks: 5, '6': 5 };
const CMD = /\b(?:(back|undo|previous)|(?:option|number|pick|take|choose|go)\s+(one|won|1|two|to|too|2|three|tree|free|3|four|for|4|five|5|six|sicks|6)|((?:next|new|change|switch|another)\s+key|modulate)|(shuffle|new options|other options|more options|refresh)|(show\s+examples?|examples?\s+on)|(hide\s+examples?|examples?\s+off)|(play(?:\s+along)?|start)|(stop|pause)|(faster|speed up)|(slower|slow down)|(next(?:\s+(?:progression|prog|one|chords?|loop))?|skip|(?:new|another|change)\s+(?:progression|prog|chords?|loop)|progression))\b/g;
function parse(t) {
  const out = [];
  let m;
  CMD.lastIndex = 0;
  while ((m = CMD.exec(t))) {
    if (m[1]) out.push(['back']);
    else if (m[2]) out.push(['opt', NUMS[m[2]]]);
    else if (m[3]) out.push(['key']);
    else if (m[4]) out.push(['shuffle']);
    else if (m[5]) out.push(['ex', true]);
    else if (m[6]) out.push(['ex', false]);
    else if (m[7]) out.push(['play']);
    else if (m[8]) out.push(['stop']);
    else if (m[9]) out.push(['tempo', 8]);
    else if (m[10]) out.push(['tempo', -8]);
    else if (m[11]) out.push(['next']);
  }
  return out;
}
function run(c) {
  if (c[0] === 'back') back();
  else if (c[0] === 'opt') takeOption(c[1]);
  else if (c[0] === 'key') randomKey();
  else if (c[0] === 'shuffle') reshuffle();
  else if (c[0] === 'ex') toggleExamples(c[1]);
  else if (c[0] === 'play') { if (!playing) startPlay(); }
  else if (c[0] === 'stop') stopPlay();
  else if (c[0] === 'tempo') setBpm(S.bpm + c[1]);
  else if (c[0] === 'next') nextProg();
}
function status(msg, warn) {
  const s = $('status');
  if (!msg) { s.hidden = true; return; }
  s.hidden = false;
  s.className = 'status' + (warn ? ' warn' : '');
  s.innerHTML = msg;
}
function micUI(state) {
  const b = $('mic');
  b.classList.toggle('on', state === 'on');
  b.classList.toggle('err', state === 'err');
  b.setAttribute('aria-pressed', String(state === 'on'));
  $('mic-txt').textContent = state === 'on' ? 'Listening' : state === 'err' ? 'Voice blocked' : 'Voice off';
}
async function keepAwake(on) {
  try {
    if (on && !wake && 'wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen');
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { wake = null; if (listening || playing) keepAwake(true); }
});

function startVoice() {
  if (!SR) { micUI('err'); status("This browser doesn't do speech recognition. Use Chrome or Safari, or tap and keys.", true); return; }
  listening = true;
  micUI('on');
  status('Say <b>"next"</b>, <b>"option 2"</b>, <b>"next key"</b>, <b>"play"</b>, <b>"back"</b>.');
  keepAwake(true);
  begin();
}
function begin() {
  try {
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';
    const my = ++sess;
    fired = {};
    rec.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript.toLowerCase();
        const cmds = parse(t), id = my + ':' + i, done = fired[id] || 0;
        if (cmds.length > done) {
          cmds.slice(done).forEach(run);
          fired[id] = cmds.length;
          showHeard(t.trim());
        }
      }
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        stopVoice(true);
        status(framed
          ? "The mic is blocked inside Claude's viewer. Open the page on its own (e.g. on GitHub Pages) to use voice. Tap and keys work here."
          : 'Mic access was refused. Allow the microphone for this page in your browser settings, then tap Voice again.', true);
      } else if (e.error === 'audio-capture') {
        stopVoice(true);
        status('No microphone found.', true);
      } else if (e.error === 'network') {
        status('Voice needs an internet connection (the browser sends audio to its speech service).', true);
      }
    };
    rec.onend = () => { if (listening && my === sess) setTimeout(() => { if (listening) begin(); }, 250); };
    rec.start();
  } catch (e) {
    stopVoice(true);
    status("Couldn't start voice here. Tap and keys still work.", true);
  }
}
function stopVoice(err) {
  listening = false;
  sess++;
  try { if (rec) rec.abort(); } catch (e) {}
  rec = null;
  micUI(err ? 'err' : 'off');
  if (!playing) keepAwake(false);
  if (!err) status('');
}
function showHeard(t) {
  status(`Heard <span class="heard">"${t.replace(/[<>&]/g, '')}"</span>`);
  clearTimeout(heardTimer);
  heardTimer = setTimeout(() => { if (listening) status('Listening…'); }, 2500);
}
$('mic').addEventListener('click', () => { if (listening) stopVoice(false); else startVoice(); });

/* ---------- go ---------- */
cur = fresh();
renderExToggle();
render();
</script>
</body>
</html>
